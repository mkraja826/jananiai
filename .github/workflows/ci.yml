name: CI

on:
  push:
    branches: [main, "phase-**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Safety coverage gate
        run: pytest tests/safety --cov=app.safety --cov-report=term-missing --cov-fail-under=90
      - name: Full test suite
        run: pytest
      - name: Build container
        run: docker build -t janani-ai:${{ github.sha }} .

  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application test dependencies
        run: pip install -e ".[dev]"
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase
        run: >-
          supabase start
          --exclude studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed
      - name: Refresh PostgREST schema cache
        shell: bash
        run: |
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "NOTIFY pgrst, 'reload schema';"
          sleep 2
      - name: Provision two synthetic users
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          python scripts/provision_local_supabase_test_users.py --github-env "$GITHUB_ENV"
      - name: Run local RLS, RPC, storage, and governance tests
        run: pytest tests/integration -m staging -q
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup