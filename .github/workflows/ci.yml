name: CI

on:
  push:
    branches: [main, "phase-**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Safety coverage gate
        run: pytest tests/safety --cov=app.safety --cov-report=term-missing --cov-fail-under=90
      - name: Full test suite
        run: pytest
      - name: Build container
        run: docker build -t janani-ai:${{ github.sha }} .
